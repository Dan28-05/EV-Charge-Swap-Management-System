name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ev_reservations_test
          POSTGRES_USER: ev_test
          POSTGRES_PASSWORD: ev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ev_test -d ev_reservations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EV_RESERVATIONS_TEST_DATABASE: Host=localhost;Port=5432;Database=ev_reservations_test;Username=ev_test;Password=ev_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test "backend/EV Charge & Swap Management System.sln" --configuration Release
