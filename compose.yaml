services:
  api:
    container_name: ev-charge-swap-api-dev
    image: ev-charge-swap-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MockPayments__WebhookSecret: "${MOCK_PAYMENT_WEBHOOK_SECRET:-evgo-mock-payments-dev-webhook-secret-min-32chars}"
      ASPNETCORE_HTTP_PORTS: "8080"
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ev_charge_swap;Username=ev_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ConnectionStrings__Redis: "${REDIS_CONNECTION_STRING:-redis:6379}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      VerificationDelivery__ResendApiKey: "${RESEND_API_KEY:-}"
      VerificationDelivery__EmailFrom: "${VERIFICATION_EMAIL_FROM:-}"
      VerificationDelivery__TwilioAccountSid: "${TWILIO_ACCOUNT_SID:-}"
      VerificationDelivery__TwilioAuthToken: "${TWILIO_AUTH_TOKEN:-}"
      VerificationDelivery__TwilioSenderId: "${TWILIO_SENDER_ID:-}"
      BootstrapAdmin__Email: "${ADMIN_BOOTSTRAP_EMAIL:-}"
      BootstrapAdmin__FullName: "${ADMIN_BOOTSTRAP_FULL_NAME:-}"
      BootstrapAdmin__Password: "${ADMIN_BOOTSTRAP_PASSWORD:-}"
      RabbitMq__Host: "${RABBITMQ_HOST:-rabbitmq}"
      RabbitMq__Port: "${RABBITMQ_PORT:-5672}"
      RabbitMq__Username: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
      RabbitMq__VirtualHost: "${RABBITMQ_VHOST:-/}"
      LocationSearch__Endpoint: "${LOCATION_SEARCH_ENDPOINT-http://elasticsearch:9200}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    container_name: ev-charge-swap-migrate-dev
    image: ev-charge-swap-migration:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ev_charge_swap;Username=ev_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: ev-charge-swap-frontend-dev
    image: ev-charge-swap-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      - api

  postgres:
    container_name: ev-charge-swap-postgres-dev
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ev_charge_swap
      POSTGRES_USER: ev_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_user -d ev_charge_swap"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ev-charge-swap-redis-dev
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    container_name: ev-charge-swap-rabbitmq-dev
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
